<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The app is a fixed-layout shell, not a zoomable document: it already
         reflows down to phone widths, so page scaling only ever leaves the user
         panning a half-offscreen UI. maximum-scale/user-scalable pin it on
         Android; iOS Safari ignores both, so the gesture lock in src/ui/zoom.ts
         and the 16px touch inputs in styles.css cover it there. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e0e0b" />
    <!-- Brand marks live in public/, so these URLs are stable across builds and
         the same files back the manifest icons. -->
    <link rel="icon" href="/brand/marksync-mark.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>MarkSync</title>
  </head>
  <body style="background: #0e0e0b">
    <div id="app" aria-busy="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
