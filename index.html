<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e0b" />
    <!-- Brand marks live in public/, so these URLs are stable across builds and
         the same files back the manifest icons. Two SVG favicons, picked by the
         browser itself via media — same idea as the in-app mark swap in
         ui/app.ts, but the browser evaluates this one, so it also follows the OS
         preference before main.ts (and therefore the toggle) has run. -->
    <link rel="icon" href="/brand/marksync-mark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/brand/marksync-mark-onlight.svg" type="image/svg+xml" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>MarkSync</title>
  </head>
  <body style="background: #0e0e0b">
    <div id="app" aria-busy="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
