name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel older in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The @xbrowsersync/core git dependency is pinned to a git+ssh URL. CI has no
      # SSH key, so rewrite to authenticated HTTPS. core is private, so a token with
      # read access to it is required: set the CORE_CLONE_TOKEN repo secret to a
      # fine-grained PAT (Contents: read on xbrowsersync/core). If core is later made
      # public, an anonymous HTTPS rewrite would suffice instead.
      - name: Use authenticated HTTPS for github.com git deps
        run: |
          git config --global url."https://x-access-token:${CORE_CLONE_TOKEN}@github.com/".insteadOf "git@github.com:"
        env:
          CORE_CLONE_TOKEN: ${{ secrets.CORE_CLONE_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm gen:icons

      - run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
