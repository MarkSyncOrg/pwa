name: Deploy PWA to GitHub Pages

# Auto-deploy on push is disabled for now (GitHub Pages needs the repo public on
# the free plan). Trigger manually once the repo is public or the plan supports it.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel older in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Job-level so every pnpm invocation (install and the implicit deps re-check
    # before each script) can read the private @marksyncorg/core package.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@marksyncorg'

      # Reads the private @marksyncorg/core package from GitHub Packages. The repo's
      # GITHUB_TOKEN works because the package grants this repo read access (package
      # settings -> Manage Actions access). --no-frozen-lockfile lets CI resolve the
      # registry dependency (the committed lockfile cannot be regenerated locally
      # without a read:packages token).
      - run: pnpm install --no-frozen-lockfile

      - run: pnpm gen:icons

      - run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
